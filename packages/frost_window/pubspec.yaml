name: frost_window
description: Native desktop window behaviour for normalllll's apps.
publish_to: none
version: 0.3.0

environment:
  sdk: ^3.12.1
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      linux:
        pluginClass: FrostWindowPlugin
      macos:
        pluginClass: FrostWindowPlugin
      windows:
        pluginClass: FrostWindowPluginCApi
